services:
  db_postgres:
    container_name: 'db_boilerplate'
    image: 'postgres:14.2-alpine'
    restart: always
    env_file:
      - .env
    ports:
      # 8432 on the host: 5432 is often taken by a locally installed PostgreSQL
      - '8432:5432'
    volumes:
      # named volume instead of ./database: a bind mount from a Windows folder breaks
      # PostgreSQL's ownership/permission checks on the data directory
      - db_data:/var/lib/postgresql/data/

  be_boilerplate:
    entrypoint: /bin/sh './scripts/be-node-dev.sh'
    env_file:
      - .env
    environment:
      # .env points to localhost:8432 for running on the host; inside the network use the service name
      PG_HOST: db_postgres
      PG_PORT: '5432'
    ports:
      - '4000:4000'
    depends_on:
      - db_postgres
    links:
      - db_postgres

  be_boilerplate_test:
    container_name: 'be_boilerplate_test'
    command: sh -c "echo 'Test container ready' && tail -f /dev/null"
    build: .
    stdin_open: true
    tty: true
    depends_on:
      - db_postgres
    links:
      - db_postgres
    env_file:
      - .env
    environment:
      PG_HOST: db_postgres
      PG_PORT: '5432'
    volumes:
      - .:/app/
      - /app/node_modules

volumes:
  db_data:
